<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    Meridian favicon. Mirrors the in-app lockup (see src/components/logo): a
    sphere with one meridian arc, inside a rounded square filled with the
    theme's primary colour. The fill/stroke swap under prefers-color-scheme so
    the icon stays legible on both light and dark browser chrome — SVG favicons
    honour this media query.
  -->
  <style>
    .badge { fill: #171717; }
    .mark { stroke: #fafafa; }
    @media (prefers-color-scheme: dark) {
      .badge { fill: #fafafa; }
      .mark { stroke: #171717; }
    }
  </style>
  <rect class="badge" width="32" height="32" rx="8" />
  <g class="mark" fill="none" stroke-width="2.5" stroke-linecap="round">
    <circle cx="16" cy="16" r="10" />
    <path d="M16 6a13.333 13.333 0 0 0 0 20" />
  </g>
</svg>
